# ==============================================================================
# AntiGravity Mobile Store Backend — Application Configuration
# ==============================================================================

# Server Port
server.port=${SERVER_PORT:8080}

# Database Connection (MySQL 8.0) — Environment Variables via dotenv-java
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/mobile_store?useSSL=true&sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:3HVUhdVZBhSBCPs.root}
spring.datasource.password=${DB_PASSWORD:6BP74bdgTlFpWzrm}
# JPA & Hibernate Configuration (Auto-update during development, SQL formatting enabled)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SQL Script Initialization (Default to never so developers initialize via schema.sql & seed.sql)
spring.sql.init.mode=never

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:antigravity_mobile_store_super_secret_jwt_key_2026_production_grade_token_signing_secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Cloudinary Media Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:yx3r97ac}
cloudinary.api-key=${CLOUDINARY_API_KEY:665272951174257}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:WBXFMde0defk0rcafmPXPt2lOd0}

# Application Metadata & Logging
spring.application.name=mobile-store-backend
logging.level.com.mobilestore=INFO

# Multipart File Upload Configuration (5MB per file, 25MB total request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# CORS Allowed Origins (Localhost, Local LAN/Wi-Fi IPs for mobile, Vercel, Netlify, Render)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://localhost:5173,http://192.168.*:*,http://10.*:*,http://172.*:*,http://*:5173,http://*:3000,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com}


