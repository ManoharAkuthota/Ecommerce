<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Smartphone chassis -->
  <rect x="18" y="10" width="28" height="44" rx="7" fill="#090d16" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Speaker bar -->
  <line x1="28" y1="14" x2="36" y2="14" stroke="#475569" stroke-width="1.5" stroke-linecap="round" />

  <!-- Screen content: Modern 'MS' monogram -->
  <text x="32" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">MS</text>

  <!-- Home indicator bar -->
  <line x1="26" y1="50" x2="38" y2="50" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" />
</svg>
